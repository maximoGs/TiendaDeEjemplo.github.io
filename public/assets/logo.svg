<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y profundidad -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Rutas circulares para el texto arqueado -->
    <path id="textPathTop" d="M 88,250 A 162,162 0 0,1 412,250" fill="none"/>
    <path id="textPathBottom" d="M 412,250 A 162,162 0 0,1 88,250" fill="none"/>
    
    <!-- Gradientes para las escamas del lúpulo -->
    <linearGradient id="hopLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ec2c5"/>
      <stop offset="45%" stop-color="#43a6a9"/>
      <stop offset="100%" stop-color="#2a7d80"/>
    </linearGradient>
    <linearGradient id="hopLeafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46a7aa"/>
      <stop offset="100%" stop-color="#1f6568"/>
    </linearGradient>
  </defs>

  <!-- Borde Exterior Mostaza / Oro Cálido -->
  <circle cx="250" cy="250" r="238" fill="#e5aa38" stroke="#1f1418" stroke-width="5" filter="url(#badgeShadow)"/>
  
  <!-- Anillo Intermedio Turquesa / Teal Vintage -->
  <circle cx="250" cy="250" r="198" fill="#3ba0a3" stroke="#241318" stroke-width="4.5"/>
  
  <!-- Círculo Central Borgoña / Maroon Profundo -->
  <circle cx="250" cy="250" r="126" fill="#542129" stroke="#e5aa38" stroke-width="4.5"/>

  <!-- Puntos decorativos laterales -->
  <circle cx="86" cy="250" r="5.5" fill="#2d1319"/>
  <circle cx="414" cy="250" r="5.5" fill="#2d1319"/>

  <!-- Texto Superior: PAISANA -->
  <text fill="#2d1319" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="45" letter-spacing="10">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      PAISANA
    </textPath>
  </text>

  <!-- Texto Inferior: BEBIDAS -->
  <text fill="#e5aa38" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="43" letter-spacing="11">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      BEBIDAS
    </textPath>
  </text>

  <!-- ILUSTRACIÓN CENTRAL: CONO DE LÚPULO (HOP CONE EXACTO) -->
  <g id="hopConeExact" transform="translate(0, 8)">
    
    <!-- Tallo superior curvado -->
    <path d="M 250,146 Q 248,130 262,134 Q 256,146 250,150 Z" fill="#e5aa38" stroke="#2d1319" stroke-width="2"/>
    <!-- Pequeñas hojitas de la base del tallo -->
    <path d="M 250,149 C 242,143 234,147 236,155 C 243,156 248,153 250,149 Z" fill="#e5aa38" stroke="#2d1319" stroke-width="1.5"/>
    <path d="M 250,149 C 258,143 266,147 264,155 C 257,156 252,153 250,149 Z" fill="#e5aa38" stroke="#2d1319" stroke-width="1.5"/>

    <!-- TIER 1: Escamas Superiores (Corona) -->
    <!-- Escama Superior Izquierda -->
    <g>
      <path d="M 248,150 C 230,154 220,172 232,188 C 245,188 250,170 248,150 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="2.8"/>
      <path d="M 246,155 Q 235,170 234,185" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Escama Superior Derecha -->
    <g>
      <path d="M 252,150 C 270,154 280,172 268,188 C 255,188 250,170 252,150 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="2.8"/>
      <path d="M 254,155 Q 265,170 266,185" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Escama Superior Centro -->
    <g>
      <path d="M 250,152 C 238,165 236,185 250,198 C 264,185 262,165 250,152 Z" fill="url(#hopLeafGrad)" stroke="#e5aa38" stroke-width="3"/>
      <line x1="250" y1="156" x2="250" y2="194" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- TIER 2: Escamas Hombros / Superiores-Medias (Ancho máximo) -->
    <!-- Extremo Izquierdo Superior -->
    <g>
      <path d="M 230,174 C 202,180 190,205 208,226 C 226,226 235,206 230,174 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 226,180 Q 206,204 212,222" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Extremo Derecho Superior -->
    <g>
      <path d="M 270,174 C 298,180 310,205 292,226 C 274,226 265,206 270,174 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 274,180 Q 294,204 288,222" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Centro-Izquierda Superior -->
    <g>
      <path d="M 242,182 C 220,196 214,224 236,242 C 252,228 252,204 242,182 Z" fill="url(#hopLeafGrad)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 240,188 Q 228,214 235,236" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Centro-Derecha Superior -->
    <g>
      <path d="M 258,182 C 280,196 286,224 264,242 C 248,228 248,204 258,182 Z" fill="url(#hopLeafGrad)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 260,188 Q 272,214 265,236" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- TIER 3: Escamas Medias / Laterales -->
    <!-- Lateral Izquierda Media -->
    <g>
      <path d="M 212,214 C 188,228 184,258 206,278 C 228,272 232,246 212,214 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 208,222 Q 194,252 208,272" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Lateral Derecha Media -->
    <g>
      <path d="M 288,214 C 312,228 316,258 294,278 C 272,272 268,246 288,214 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 292,222 Q 306,252 292,272" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Centro Medio -->
    <g>
      <path d="M 250,210 C 228,230 226,264 250,282 C 274,264 272,230 250,210 Z" fill="url(#hopLeafGrad)" stroke="#e5aa38" stroke-width="3.2"/>
      <line x1="250" y1="216" x2="250" y2="276" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- TIER 4: Escamas Inferiores (Estrechamiento) -->
    <!-- Inferior Izquierda -->
    <g>
      <path d="M 224,262 C 208,284 218,312 238,322 C 252,310 250,286 224,262 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 226,270 Q 220,296 235,316" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Inferior Derecha -->
    <g>
      <path d="M 276,262 C 292,284 282,312 262,322 C 248,310 250,286 276,262 Z" fill="url(#hopLeafDark)" stroke="#e5aa38" stroke-width="3"/>
      <path d="M 274,270 Q 280,296 265,316" stroke="#e5aa38" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- TIER 5: Punta Inferior Central -->
    <g>
      <path d="M 250,260 C 232,284 234,328 250,344 C 266,328 268,284 250,260 Z" fill="url(#hopLeafGrad)" stroke="#e5aa38" stroke-width="3.5"/>
      <line x1="250" y1="268" x2="250" y2="336" stroke="#e5aa38" stroke-width="2.5" stroke-linecap="round"/>
    </g>

  </g>
</svg>
